<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PaDyViR - AR Room</title>
    
    <!-- A-Frame AR Framework -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/supermedium/superframe@master/components/physics-system/dist/aframe-physics-system.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, rgba(12, 12, 12, 0.95) 0%, rgba(26, 26, 46, 0.9) 25%, rgba(22, 33, 62, 0.85) 50%, rgba(15, 52, 96, 0.9) 75%, rgba(83, 53, 74, 0.95) 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            backdrop-filter: blur(2px);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Futuristic background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            animation: float 6s linear infinite;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .particle:nth-child(odd) {
            background: rgba(255, 0, 255, 0.3);
            animation-duration: 8s;
            box-shadow: 0 0 8px rgba(255, 0, 255, 0.2);
        }

        .particle:nth-child(3n) {
            background: rgba(255, 255, 0, 0.4);
            animation-duration: 4s;
            box-shadow: 0 0 12px rgba(255, 255, 0, 0.25);
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
            opacity: 0.6;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Main container */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            max-width: 90%;
            padding: 2rem;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.1),
                inset 0 0 30px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Main title */
        .main-title {
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 900;
            font-family: 'Orbitron', monospace;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00, #00ff00, #ff0040);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 3s ease-in-out infinite, titleGlow 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
            transform: perspective(500px) rotateY(0deg);
            animation: titleEntry 2s ease-out, gradientText 3s ease-in-out infinite 2s, titleFloat 4s ease-in-out infinite 4s;
            line-height: 1;
        }

        @keyframes gradientText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes titleGlow {
            0%, 100% { 
                text-shadow: 
                    0 0 10px rgba(0, 255, 255, 0.5),
                    0 0 20px rgba(0, 255, 255, 0.3),
                    0 0 30px rgba(0, 255, 255, 0.2);
            }
            50% { 
                text-shadow: 
                    0 0 20px rgba(255, 0, 255, 0.8),
                    0 0 40px rgba(255, 0, 255, 0.5),
                    0 0 60px rgba(255, 0, 255, 0.3);
            }
        }

        @keyframes titleEntry {
            0% {
                opacity: 0;
                transform: perspective(500px) rotateY(90deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: perspective(500px) rotateY(0deg) scale(1);
            }
        }

        @keyframes titleFloat {
            0%, 100% { transform: perspective(500px) rotateY(0deg) translateY(0px); }
            50% { transform: perspective(500px) rotateY(5deg) translateY(-10px); }
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            font-weight: 400;
            font-family: 'Rajdhani', sans-serif;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            animation: subtitleEntry 2s ease-out 0.5s both, subtitleGlow 3s ease-in-out infinite 2.5s;
            line-height: 1.2;
        }

        @keyframes subtitleEntry {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        @keyframes subtitleGlow {
            0%, 100% { 
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
            50% { 
                text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            }
        }

        /* Loading bar container */
        .loading-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 2rem;
            animation: loadingEntry 2s ease-out 1s both;
        }

        @keyframes loadingEntry {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            line-height: 1.3;
        }

        /* Futuristic loading bar */
        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 0 10px rgba(0, 255, 255, 0.2),
                0 0 10px rgba(0, 255, 255, 0.1);
            margin: 1rem 0;
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: loadingProgress 3s ease-in-out 1.5s both, gradientMove 2s linear infinite;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.8),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes loadingProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Progress percentage */
        .progress-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00ffff;
            margin-top: 1rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            line-height: 1;
        }

        /* Status message */
        .status-message {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            animation: statusPulse 2s ease-in-out infinite;
            line-height: 1.3;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Enter button */
        .enter-button {
            display: none;
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.8), rgba(255, 0, 255, 0.8));
            background-size: 200% 200%;
            color: #000;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 3rem;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            animation: buttonGlow 2s ease-in-out infinite, gradientShift 3s ease infinite;
            backdrop-filter: blur(2px);
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.3),
                0 0 40px rgba(255, 0, 255, 0.2),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .enter-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.8),
                0 0 60px rgba(255, 0, 255, 0.5),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .enter-button:active {
            transform: translateY(-1px) scale(1.02);
        }

        .enter-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .enter-button:hover::before {
            left: 100%;
        }

        @keyframes buttonGlow {
            0%, 100% { 
                text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            }
            50% { 
                text-shadow: 0 0 20px rgba(0, 0, 0, 1);
            }
        }

        .enter-button.show {
            display: inline-block;
            animation: buttonEntry 1s ease-out forwards, buttonGlow 2s ease-in-out infinite 1s, gradientShift 3s ease infinite 1s;
        }

        @keyframes buttonEntry {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0px) scale(1);
            }
        }

        /* AR Control Buttons */
        .ar-button {
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.6), rgba(255, 0, 255, 0.6));
            background-size: 200% 200%;
            color: #000;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 0.8rem 1.5rem;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-radius: 25px;
            cursor: pointer;
            margin: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(2px);
            box-shadow: 
                0 0 15px rgba(0, 255, 255, 0.2),
                0 0 30px rgba(255, 0, 255, 0.1),
                inset 0 0 15px rgba(255, 255, 255, 0.1);
            min-height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .ar-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.4),
                0 0 40px rgba(255, 0, 255, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .ar-button:active {
            transform: translateY(0px) scale(0.98);
        }

        /* AR overlay effect */
        .hologram-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: linear-gradient(45deg, transparent 20%, rgba(0, 255, 255, 0.02) 40%, rgba(255, 255, 255, 0.01) 50%, rgba(0, 255, 255, 0.02) 60%, transparent 80%);
            animation: hologramScan 6s linear infinite;
            pointer-events: none;
            -webkit-backdrop-filter: blur(0.5px);
            backdrop-filter: blur(0.5px);
            border-radius: 50%;
            backdrop-filter: blur(0.5px);
        }

        @keyframes hologramScan {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
                max-width: 95%;
                border-radius: 15px;
            }
            
            .main-title {
                font-size: clamp(2rem, 10vw, 4rem);
                margin-bottom: 0.8rem;
                line-height: 1;
            }
            
            .subtitle {
                font-size: clamp(1rem, 4vw, 1.5rem);
                margin-bottom: 2.5rem;
                line-height: 1.2;
            }
            
            .loading-container {
                max-width: 90%;
            }
            
            .loading-text {
                font-size: 1.1rem;
                line-height: 1.3;
            }
            
            .status-message {
                font-size: 0.95rem;
                line-height: 1.3;
            }
            
            .enter-button {
                padding: 1rem 2.5rem;
                font-size: 1.1rem;
                min-height: 48px;
            }
        }

        /* Mobile landscape optimizations */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 0.5rem 1rem;
            }
            
            .container {
                padding: 1.5rem 2rem;
                max-width: 90%;
                border-radius: 15px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 0;
            }
            
            .main-title {
                font-size: clamp(2rem, 7vh, 3.5rem);
                margin-bottom: 0.5rem;
                letter-spacing: 0.08em;
                line-height: 1;
            }
            
            .subtitle {
                font-size: clamp(1rem, 3.5vh, 1.5rem);
                margin-bottom: 2rem;
                letter-spacing: 0.15em;
                line-height: 1.2;
            }
            
            .loading-container {
                max-width: 75%;
                margin: 0 auto 1.5rem;
            }
            
            .loading-text {
                font-size: 1.1rem;
                margin-bottom: 1rem;
                line-height: 1.3;
            }
            
            .loading-bar {
                height: 4px;
                margin: 0.8rem 0;
            }
            
            .progress-text {
                font-size: 1.1rem;
                margin-top: 1rem;
            }
            
            .status-message {
                font-size: 1rem;
                margin-top: 1.5rem;
                line-height: 1.3;
            }
            
            .enter-button {
                padding: 1rem 2.5rem;
                font-size: 1.1rem;
                margin-top: 1.5rem;
                min-height: 48px;
            }
        }

        /* Very small landscape screens (like phones in landscape) */
        @media screen and (max-height: 400px) and (orientation: landscape) {
            body {
                padding: 0.3rem 0.8rem;
            }
            
            .container {
                padding: 1.2rem 1.8rem;
                max-width: 92%;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            
            .main-title {
                font-size: clamp(1.6rem, 6vh, 2.8rem);
                margin-bottom: 0.4rem;
                line-height: 0.95;
            }
            
            .subtitle {
                font-size: clamp(0.85rem, 3vh, 1.2rem);
                margin-bottom: 1.3rem;
                line-height: 1.1;
            }
            
            .loading-container {
                max-width: 65%;
                margin: 0 auto 1.2rem;
            }
            
            .loading-text {
                font-size: 0.95rem;
                margin-bottom: 0.8rem;
                line-height: 1.2;
            }
            
            .loading-bar {
                height: 3px;
                margin: 0.6rem 0;
            }
            
            .progress-text {
                font-size: 0.95rem;
                margin-top: 0.8rem;
            }
            
            .status-message {
                font-size: 0.9rem;
                margin-top: 1.2rem;
                line-height: 1.2;
            }
            
            .enter-button {
                padding: 0.8rem 2rem;
                font-size: 0.95rem;
                margin-top: 1.2rem;
                min-height: 44px;
            }
        }

        /* Landscape tablets and larger screens */
        @media screen and (min-width: 768px) and (max-height: 600px) and (orientation: landscape) {
            .container {
                max-width: 85%;
                padding: 1.5rem;
            }
            
            .main-title {
                font-size: clamp(3rem, 7vh, 5rem);
            }
            
            .subtitle {
                font-size: clamp(1.2rem, 3vh, 2rem);
                margin-bottom: 2rem;
            }
            
            .loading-container {
                max-width: 60%;
            }
        }

        /* Touch-friendly enhancements for mobile */
        @media (hover: none) and (pointer: coarse) {
            .enter-button {
                min-height: 44px; /* iOS recommended touch target size */
                padding: 1rem 2.5rem;
                font-size: 1.1rem;
            }
            
            .enter-button:active {
                transform: translateY(0px) scale(0.98);
                transition: transform 0.1s ease;
            }
        }

        /* Prevent text selection on touch devices - only for specific elements */
        @media (hover: none) {
            .main-title, .subtitle, .loading-text, .status-message {
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }
            
            .enter-button {
                -webkit-touch-callout: default;
                user-select: none;
                -webkit-tap-highlight-color: rgba(0, 255, 255, 0.3);
            }
        }

        /* AR scan lines effect */
        .scan-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 3px,
                rgba(0, 255, 255, 0.015) 3px,
                rgba(0, 255, 255, 0.015) 6px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanMove 4s linear infinite;
            opacity: 0.7;
        }

        @keyframes scanMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <!-- AR Scene -->
    <a-scene 
        id="ar-scene"
        embedded 
        style="height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 1;"
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        physics="driver: cannon; restitution: 0.3"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <!-- AR Camera -->
        <a-camera 
            id="ar-camera"
            gps-entity-place="latitude: 0; longitude: 0;"
            look-controls="enabled: false; magicWindowTrackingEnabled: false; touchEnabled: false; mouseEnabled: false"
            cursor="rayOrigin: mouse">
        </a-camera>
        
        <!-- Lighting -->
        <a-light type="ambient" color="#ffffff" intensity="0.4"></a-light>
        <a-light type="directional" position="2 4 5" color="#ffffff" intensity="0.8"></a-light>
        
        <!-- Fallback 3D Scene for non-AR devices -->
        <a-entity id="fallback-scene" visible="true">
            <!-- Background -->
            <a-sky color="#0c0c0c"></a-sky>
            
            <!-- 3D Particle System -->
            <a-entity id="fallback-particles" position="0 1.6 -3">
                <a-sphere 
                    position="0 0 0" 
                    radius="0.2" 
                    color="#00ffff"
                    animation="property: rotation; to: 360 360 0; loop: true; dur: 4000"
                    material="shader: standard; metalness: 0.8; roughness: 0.2; emissive: #00ffff; emissiveIntensity: 0.5">
                </a-sphere>
                
                <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">
                    <a-sphere position="1 0 0" radius="0.1" color="#ff00ff" 
                              material="shader: standard; emissive: #ff00ff; emissiveIntensity: 0.6"></a-sphere>
                </a-entity>
                
                <a-entity animation="property: rotation; to: 0 -360 0; loop: true; dur: 4000">
                    <a-sphere position="0.6 0.6 0" radius="0.08" color="#ffff00" 
                              material="shader: standard; emissive: #ffff00; emissiveIntensity: 0.6"></a-sphere>
                </a-entity>
                
                <a-entity animation="property: rotation; to: 360 0 0; loop: true; dur: 2500">
                    <a-sphere position="0 0.8 0" radius="0.06" color="#00ff00" 
                              material="shader: standard; emissive: #00ff00; emissiveIntensity: 0.6"></a-sphere>
                </a-entity>
            </a-entity>
            
            <!-- 3D Text -->
            <a-text 
                value="PaDyViR AR Room" 
                position="0 2.5 -3" 
                align="center" 
                color="#00ffff"
                text="font: roboto; width: 8; color: #00ffff; align: center">
            </a-text>
        </a-entity>
    </a-scene>

    <!-- UI Overlay -->
    <div id="ui-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;">
    <!-- Background particles -->
    <div class="particles"></div>
    
    <!-- Grid overlay -->
    <div class="grid-overlay"></div>
    
    <!-- Scan lines -->
    <div class="scan-lines"></div>
    
    <!-- Hologram effect -->
    <div class="hologram-effect"></div>
    
    <!-- Main content -->
    <div class="container">
        <h1 class="main-title">PaDyViR</h1>
        <h2 class="subtitle">Particle Dynamics Augmented Reality</h2>
        
        <div class="loading-container">
            <div class="loading-text">Initializing AR Room</div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="progress-text">0%</div>
        </div>
        
        <div class="status-message">Preparing AR Room experience...</div>
        
        <!-- AR Controls -->
        <div id="ar-controls" style="display: none; margin-top: 1rem;">
            <button class="ar-button" id="start-ar-btn">
                📱 Start AR Mode
            </button>
            <button class="ar-button" id="toggle-3d-btn">
                🔄 Toggle 3D View
            </button>
        </div>
        
        <!-- Enter Button -->
        <button class="enter-button" id="enter-btn">
            🔮 Enter AR Room
        </button>
    </div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            // Reduce particle count on mobile landscape for better performance
            const isMobileLandscape = window.innerHeight < 500 && window.innerWidth > window.innerHeight;
            const particleCount = isMobileLandscape ? 30 : 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Update progress and status
        function updateProgress() {
            const progressBar = document.querySelector('.loading-progress');
            const progressText = document.querySelector('.progress-text');
            const statusMessage = document.querySelector('.status-message');
            
            const messages = [
                'Loading AR framework...',
                'Initializing camera access...',
                'Setting up 3D particles...',
                'Calibrating AR tracking...',
                'Finalizing AR Room...',
                'AR Room Ready!'
            ];
            
            let progress = 0;
            let messageIndex = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 15 + 5;
                if (progress > 100) progress = 100;
                
                progressText.textContent = Math.floor(progress) + '%';
                
                // Update status message
                if (messageIndex < messages.length - 1 && progress > (messageIndex + 1) * 16.67) {
                    messageIndex++;
                    statusMessage.textContent = messages[messageIndex];
                }
                
                if (progress >= 100) {
                    clearInterval(interval);
                    statusMessage.textContent = messages[messages.length - 1];
                    
                    // Show enter button and AR controls
                    setTimeout(() => {
                        showARControls();
                    }, 1000);
                }
            }, 100);
        }

        // Show AR controls when loading is complete
        function showARControls() {
            const enterBtn = document.getElementById('enter-btn');
            const arControls = document.getElementById('ar-controls');
            const statusMessage = document.querySelector('.status-message');
            
            // Update status message
            statusMessage.textContent = 'AR Room Ready!';
            statusMessage.style.color = '#00ff00';
            
            // Show button and AR controls with animation
            enterBtn.classList.add('show');
            arControls.style.display = 'block';
            arControls.style.animation = 'buttonEntry 1s ease-out forwards';
            
            // Add click handlers
            setupARControls();
        }

        // Setup AR control functionality
        function setupARControls() {
            const enterBtn = document.getElementById('enter-btn');
            const startARBtn = document.getElementById('start-ar-btn');
            const toggle3DBtn = document.getElementById('toggle-3d-btn');
            const arScene = document.getElementById('ar-scene');
            const fallbackScene = document.getElementById('fallback-scene');
            
            // Enter AR Room button
            enterBtn.addEventListener('click', () => {
                enterBtn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    enterARRoom();
                }, 200);
            });
            
            // Start AR Mode button
            startARBtn.addEventListener('click', () => {
                requestARPermissions();
            });
            
            // Toggle 3D View button
            toggle3DBtn.addEventListener('click', () => {
                toggle3DView();
            });
        }

        // Enter AR Room function
        function enterARRoom() {
            const uiOverlay = document.getElementById('ui-overlay');
            const container = document.querySelector('.container');
            
            // Hide the loading UI with transition
            container.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
            container.style.opacity = '0';
            container.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                // Hide most UI elements but keep some controls visible
                container.style.display = 'none';
                
                // Show minimal AR overlay UI
                showAROverlay();
                
                // Start AR experience
                startARExperience();
            }, 500);
        }

        // Request AR permissions
        function requestARPermissions() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        // Permission granted, enable AR mode
                        enableARMode(stream);
                    })
                    .catch(err => {
                        console.log('AR not available, using 3D mode:', err);
                        alert('AR camera access not available. Using 3D mode instead.');
                        enable3DMode();
                    });
            } else {
                alert('AR not supported on this device. Using 3D mode.');
                enable3DMode();
            }
        }

        // Enable AR mode
        function enableARMode(stream) {
            const arScene = document.getElementById('ar-scene');
            const fallbackScene = document.getElementById('fallback-scene');
            
            // Hide fallback scene, show AR scene
            fallbackScene.setAttribute('visible', 'false');
            
            // Setup AR camera
            const camera = document.getElementById('ar-camera');
            camera.setAttribute('look-controls', 'enabled: true; magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true');
            
            console.log('AR Mode enabled');
        }

        // Enable 3D mode
        function enable3DMode() {
            const fallbackScene = document.getElementById('fallback-scene');
            const camera = document.getElementById('ar-camera');
            
            // Ensure fallback scene is visible
            fallbackScene.setAttribute('visible', 'true');
            
            // Enable camera controls for 3D navigation
            camera.setAttribute('look-controls', 'enabled: true; magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true');
            camera.setAttribute('wasd-controls', 'enabled: true');
            
            console.log('3D Mode enabled');
        }

        // Toggle 3D view
        function toggle3DView() {
            const fallbackScene = document.getElementById('fallback-scene');
            const isVisible = fallbackScene.getAttribute('visible') === 'true';
            
            fallbackScene.setAttribute('visible', !isVisible);
            
            const btn = document.getElementById('toggle-3d-btn');
            btn.textContent = isVisible ? '🔄 Show 3D View' : '🔄 Hide 3D View';
        }

        // Start AR experience
        function startARExperience() {
            // Enable physics and interactions
            const particles = document.querySelectorAll('#fallback-particles a-sphere');
            
            particles.forEach(particle => {
                // Add click interaction
                particle.addEventListener('click', () => {
                    // Animate particle on click
                    particle.setAttribute('animation', 'property: scale; to: 1.5 1.5 1.5; dur: 300; dir: alternate; loop: 1');
                    
                    // Reset animation after completion
                    setTimeout(() => {
                        particle.removeAttribute('animation');
                        particle.setAttribute('animation', particle.getAttribute('animation') || 'property: rotation; to: 360 360 0; loop: true; dur: 4000');
                    }, 600);
                });
            });
            
            console.log('AR Room experience started');
        }

        // Show AR overlay UI
        function showAROverlay() {
            const uiOverlay = document.getElementById('ui-overlay');
            
            // Create minimal AR UI
            const arUI = document.createElement('div');
            arUI.id = 'ar-ui';
            arUI.style.cssText = `
                position: fixed;
                top: 20px;
                left: 20px;
                right: 20px;
                z-index: 20;
                display: flex;
                justify-content: space-between;
                align-items: center;
                pointer-events: auto;
            `;
            
            arUI.innerHTML = `
                <div style="background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 20px; color: #00ffff; font-family: 'Orbitron', monospace;">
                    PaDyViR AR Room
                </div>
                <button id="exit-ar" style="background: rgba(255,0,0,0.7); border: none; padding: 10px 15px; border-radius: 15px; color: white; font-weight: bold; cursor: pointer;">
                    ✖ Exit
                </button>
            `;
            
            uiOverlay.appendChild(arUI);
            
            // Add exit functionality
            document.getElementById('exit-ar').addEventListener('click', () => {
                location.reload();
            });
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            
            // Start progress animation after initial animations
            setTimeout(() => {
                updateProgress();
            }, 2000);
        });

        // Handle orientation changes for mobile devices
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                // Recreate particles with appropriate count for new orientation
                const particlesContainer = document.querySelector('.particles');
                particlesContainer.innerHTML = '';
                createParticles();
                
                // Force layout recalculation
                document.body.style.height = '100vh';
            }, 100);
        });

        // Handle resize events
        window.addEventListener('resize', () => {
            // Debounce resize events
            clearTimeout(window.resizeTimeout);
            window.resizeTimeout = setTimeout(() => {
                // Update particle count based on new screen size
                const particlesContainer = document.querySelector('.particles');
                if (particlesContainer.children.length !== (window.innerHeight < 500 && window.innerWidth > window.innerHeight ? 30 : 50)) {
                    particlesContainer.innerHTML = '';
                    createParticles();
                }
            }, 250);
        });

        // Add some interactive effects
        document.addEventListener('mousemove', (e) => {
            const hologram = document.querySelector('.hologram-effect');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            
            hologram.style.background = `linear-gradient(45deg, transparent 30%, rgba(0, 255, 255, 0.05) 50%, transparent 70%)`;
            hologram.style.transform = `translate(-50%, -50%) rotate(${x * 0.1}deg)`;
        });

        // Preload vr.html for smoother transition
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'vr.html';
        document.head.appendChild(link);
    </script>
</body>
</html>
