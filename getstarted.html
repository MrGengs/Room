<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaDyViR - Get Started</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@300;400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', monospace;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #53354a 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Futuristic background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            animation: float 6s linear infinite;
        }

        .particle:nth-child(odd) {
            background: rgba(255, 0, 255, 0.6);
            animation-duration: 8s;
        }

        .particle:nth-child(3n) {
            background: rgba(255, 255, 0, 0.7);
            animation-duration: 4s;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* Grid overlay */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Main container */
        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            max-width: 90%;
        }

        /* Main title */
        .main-title {
            font-size: clamp(3rem, 8vw, 8rem);
            font-weight: 900;
            font-family: 'Orbitron', monospace;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00, #00ff00, #ff0040);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientText 3s ease-in-out infinite, titleGlow 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
            transform: perspective(500px) rotateY(0deg);
            animation: titleEntry 2s ease-out, gradientText 3s ease-in-out infinite 2s, titleFloat 4s ease-in-out infinite 4s;
        }

        @keyframes gradientText {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes titleGlow {
            0%, 100% { 
                text-shadow: 
                    0 0 10px rgba(0, 255, 255, 0.5),
                    0 0 20px rgba(0, 255, 255, 0.3),
                    0 0 30px rgba(0, 255, 255, 0.2);
            }
            50% { 
                text-shadow: 
                    0 0 20px rgba(255, 0, 255, 0.8),
                    0 0 40px rgba(255, 0, 255, 0.5),
                    0 0 60px rgba(255, 0, 255, 0.3);
            }
        }

        @keyframes titleEntry {
            0% {
                opacity: 0;
                transform: perspective(500px) rotateY(90deg) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: perspective(500px) rotateY(0deg) scale(1);
            }
        }

        @keyframes titleFloat {
            0%, 100% { transform: perspective(500px) rotateY(0deg) translateY(0px); }
            50% { transform: perspective(500px) rotateY(5deg) translateY(-10px); }
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            font-weight: 400;
            font-family: 'Rajdhani', sans-serif;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            animation: subtitleEntry 2s ease-out 0.5s both, subtitleGlow 3s ease-in-out infinite 2.5s;
        }

        @keyframes subtitleEntry {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        @keyframes subtitleGlow {
            0%, 100% { 
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
            50% { 
                text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            }
        }

        /* Loading bar container */
        .loading-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 2rem;
            animation: loadingEntry 2s ease-out 1s both;
        }

        @keyframes loadingEntry {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .loading-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Futuristic loading bar */
        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 0 10px rgba(0, 255, 255, 0.2),
                0 0 10px rgba(0, 255, 255, 0.1);
        }

        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00);
            background-size: 200% 100%;
            border-radius: 10px;
            animation: loadingProgress 3s ease-in-out 1.5s both, gradientMove 2s linear infinite;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.8),
                inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        @keyframes loadingProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Progress percentage */
        .progress-text {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #00ffff;
            margin-top: 1rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        /* Status message */
        .status-message {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Holographic effect */
        .hologram-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: linear-gradient(45deg, transparent 30%, rgba(0, 255, 255, 0.03) 50%, transparent 70%);
            animation: hologramScan 4s linear infinite;
            pointer-events: none;
            z-index: 2;
        }

        @keyframes hologramScan {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .main-title {
                font-size: clamp(2rem, 10vw, 4rem);
                margin-bottom: 0.5rem;
            }
            
            .subtitle {
                font-size: clamp(1rem, 4vw, 1.5rem);
                margin-bottom: 2rem;
            }
            
            .loading-container {
                max-width: 90%;
            }
        }

        /* Scan lines effect */
        .scan-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 2px,
                rgba(0, 255, 255, 0.03) 2px,
                rgba(0, 255, 255, 0.03) 4px
            );
            pointer-events: none;
            z-index: 1;
            animation: scanMove 3s linear infinite;
        }

        @keyframes scanMove {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <!-- Background particles -->
    <div class="particles"></div>
    
    <!-- Grid overlay -->
    <div class="grid-overlay"></div>
    
    <!-- Scan lines -->
    <div class="scan-lines"></div>
    
    <!-- Hologram effect -->
    <div class="hologram-effect"></div>
    
    <!-- Main content -->
    <div class="container">
        <h1 class="main-title">PaDyViR</h1>
        <h2 class="subtitle">Particle Dynamics Virtual Reality</h2>
        
        <div class="loading-container">
            <div class="loading-text">Initializing Virtual Environment</div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <div class="progress-text">0%</div>
        </div>
        
        <div class="status-message">Preparing immersive experience...</div>
    </div>

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Update progress and status
        function updateProgress() {
            const progressBar = document.querySelector('.loading-progress');
            const progressText = document.querySelector('.progress-text');
            const statusMessage = document.querySelector('.status-message');
            
            const messages = [
                'Loading physics engine...',
                'Initializing VR components...',
                'Setting up particle systems...',
                'Calibrating dynamics...',
                'Finalizing environment...',
                'Ready to launch!'
            ];
            
            let progress = 0;
            let messageIndex = 0;
            
            const interval = setInterval(() => {
                progress += Math.random() * 15 + 5;
                if (progress > 100) progress = 100;
                
                progressText.textContent = Math.floor(progress) + '%';
                
                // Update status message
                if (messageIndex < messages.length - 1 && progress > (messageIndex + 1) * 16.67) {
                    messageIndex++;
                    statusMessage.textContent = messages[messageIndex];
                }
                
                if (progress >= 100) {
                    clearInterval(interval);
                    statusMessage.textContent = messages[messages.length - 1];
                    
                    // Redirect after a short delay
                    setTimeout(() => {
                        // Mark that user has seen the intro
                        localStorage.setItem('padyvir_intro_seen', 'true');
                        window.location.href = 'index.html';
                    }, 1000);
                }
            }, 100);
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            
            // Start progress animation after initial animations
            setTimeout(() => {
                updateProgress();
            }, 2000);
        });

        // Add some interactive effects
        document.addEventListener('mousemove', (e) => {
            const hologram = document.querySelector('.hologram-effect');
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            
            hologram.style.background = `linear-gradient(45deg, transparent 30%, rgba(0, 255, 255, 0.05) 50%, transparent 70%)`;
            hologram.style.transform = `translate(-50%, -50%) rotate(${x * 0.1}deg)`;
        });

        // Preload index.html for smoother transition
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'index.html';
        document.head.appendChild(link);
    </script>
</body>
</html>
